<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f3f5">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>与你有源 · 管理台</title>
<link rel="stylesheet" href="style.css?v=__BUILD__">
</head>
<body>

<!-- 连接 -->
<div id="login" class="screen login">
  <div class="login-logo">源</div>
  <h1>与你有源 · 管理台</h1>
  <p class="login-sub">管理插件与目录 · 手机端</p>
  <div class="card">
    <label class="lbl">GitHub Personal Access Token</label>
    <input type="password" id="token" class="inp" placeholder="github_pat_… / ghp_…" autocomplete="off" spellcheck="false">
    <p class="hint">需要 <b>ynyy0/ynyy0.github.io</b> 的 <b>Contents: Read &amp; Write</b>。Token 只存在本机浏览器，直连 api.github.com。</p>
    <label class="chk"><input type="checkbox" id="remember" checked> 记住这台设备</label>
    <button id="btn-connect" class="btn primary block">连接</button>
    <div id="login-msg" class="msg"></div>
    <a class="link" href="https://github.com/settings/personal-access-tokens" target="_blank" rel="noopener">生成 fine-grained PAT ↗</a>
  </div>
</div>

<!-- 主界面 -->
<div id="main" class="screen" hidden>
  <header class="nav">
    <button id="nav-back" class="nav-btn" hidden>‹</button>
    <span class="nav-spacer"></span>
    <h1 id="nav-title">目录</h1>
    <span class="nav-spacer"></span>
    <button id="nav-add" class="nav-btn add">+</button>
  </header>

  <div class="dirty-bar" id="dirty-bar" hidden>
    <span id="dirty-text">⚠ 有未提交改动</span>
    <button id="dirty-go">去提交</button>
  </div>

  <div class="search-wrap">
    <span class="search-ico">⌕</span>
    <input id="search" type="search" placeholder="搜索插件" autocomplete="off">
    <button id="search-clear" class="search-clear" hidden>×</button>
  </div>

  <div id="view-dirs" class="view"></div>
  <div id="view-plugins" class="view" hidden></div>
  <div id="view-pending" class="view" hidden></div>
  <div id="view-me" class="view" hidden></div>

  <nav class="tabbar">
    <button class="tab active" data-tab="dirs">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>目录</span>
    </button>
    <button class="tab" data-tab="plugins">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg><span>全部插件</span>
    </button>
    <button class="tab" data-tab="pending">
      <svg viewBox="0 0 24 24"><path d="M12 16V4m0 0l-5 5m5-5l5 5M4 18v2h16v-2"/></svg><span>待提交<i id="tab-badge" class="badge" hidden>0</i></span>
    </button>
    <button class="tab" data-tab="me">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg><span>连接</span>
    </button>
  </nav>
</div>

<!-- 动作面板 -->
<div id="sheet" class="mask" hidden>
  <div class="sheet">
    <div id="sheet-title" class="sheet-title"></div>
    <div id="sheet-actions" class="sheet-actions"></div>
    <button id="sheet-cancel" class="sheet-cancel">取消</button>
  </div>
</div>

<!-- 输入弹窗 -->
<div id="dialog" class="mask dialog-mask" hidden>
  <div class="dialog">
    <h3 id="dialog-title"></h3>
    <p id="dialog-hint" class="hint"></p>
    <input id="dialog-input" class="inp" type="text" autocomplete="off">
    <div class="row">
      <button id="dialog-cancel" class="btn grow">取消</button>
      <button id="dialog-ok" class="btn primary grow">确定</button>
    </div>
  </div>
</div>

<input type="file" id="file-deb" accept=".deb" multiple hidden>
<input type="file" id="file-icon" accept="image/png,image/jpeg,image/webp,image/gif" hidden>

<!-- 图标大图预览 -->
<div id="img-viewer" class="mask img-viewer" hidden>
  <div class="img-box">
    <img id="img-viewer-src" src="" alt="">
    <p id="img-viewer-name" class="hint"></p>
    <button id="img-viewer-close" class="btn block">关闭</button>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="app.js?v=__BUILD__"></script>
</body>
</html>
