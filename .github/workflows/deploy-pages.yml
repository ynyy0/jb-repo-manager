name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site (exclude .git and .github)
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' ./ _site/
          # 每次部署把 commit sha 注入静态资源 URL，浏览器自动拉新版、不留旧缓存
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" _site/index.html
          grep -o 'app.js?v=[a-z0-9]*' _site/index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
